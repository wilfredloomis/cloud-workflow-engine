name = "cloud-build-worker"
main = "worker/src/index.js"
compatibility_date = "2024-12-01"

# Environment variables - set these via `wrangler secret put`
# GITHUB_TOKEN - GitHub PAT with repo and actions scope
# GITHUB_OWNER - GitHub username or org
# GITHUB_REPO - Repository name (cloud-workflow-engine)
# GITHUB_WORKFLOW_ID - Workflow file name (build-apk.yml)
# GITHUB_RELEASE_ID - Release ID for source ZIP storage

[vars]
ENVIRONMENT = "production"

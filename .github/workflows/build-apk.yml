name: Cloud APK Build
run-name: Build ${{ inputs.job_id }} - ${{ inputs.app_name }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique build job ID'
        required: true
      source_url:
        description: 'URL to download source ZIP'
        required: false
      asset_id:
        description: 'GitHub release asset ID'
        required: false
      app_name:
        description: 'Application name'
        required: true
      package_name:
        description: 'Android package name'
        required: false
      flutter_version:
        description: 'Flutter SDK version'
        required: false
        default: '3.29.1'
      build_mode:
        description: 'Build mode (release/debug/profile)'
        required: false
        default: 'release'
      project_type:
        description: 'auto/flutter/react_native/expo/native_android/capacitor/cordova/ionic'
        required: false
        default: 'auto'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up job
        run: |
          echo "========================================="
          echo "Cloud APK Build Engine"
          echo "========================================="
          echo "Job ID:          ${{ inputs.job_id }}"
          echo "App name:        ${{ inputs.app_name }}"
          echo "Package:         ${PACKAGE_NAME:-<project default>}"
          echo "Build mode:      ${{ inputs.build_mode }}"
          echo "Project type:    ${{ inputs.project_type }}"
          echo "Flutter version: ${{ inputs.flutter_version }}"
          echo "========================================="
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip curl jq

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download source code
        run: |
          if [ -n "${{ inputs.asset_id }}" ]; then
            echo "Downloading from GitHub release asset with auth..."
            curl -L -f \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/${{ inputs.asset_id }}" \
              -o source.zip
          elif [ -n "${{ inputs.source_url }}" ]; then
            echo "Downloading from source URL..."
            curl -L -f "${{ inputs.source_url }}" -o source.zip
          else
            echo "No source provided"
            exit 1
          fi
          echo "Source ZIP size: $(du -h source.zip | cut -f1)"

      - name: Clean up staging files
        run: |
          rm -rf project output
          mkdir -p project output

      - name: Extract source code
        run: |
          unzip -q source.zip -d project
          DIRS=$(find project -mindepth 1 -maxdepth 1 -type d)
          DIR_COUNT=$(echo "$DIRS" | wc -l)
          FILES_AT_ROOT=$(find project -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$DIR_COUNT" -eq 1 ] && [ "$FILES_AT_ROOT" -eq 0 ]; then
            INNER_DIR=$(echo "$DIRS" | head -1)
            echo "Moving contents from nested directory: $INNER_DIR"
            mv "$INNER_DIR"/* project/ 2>/dev/null || true
            mv "$INNER_DIR"/.* project/ 2>/dev/null || true
            rmdir "$INNER_DIR" 2>/dev/null || true
          fi
          echo "Project contents:"
          ls -la project/

      - name: Detect project type
        run: |
          if [ "${{ inputs.project_type }}" != "auto" ]; then
            PROJECT_TYPE="${{ inputs.project_type }}"
          else
            PROJECT_TYPE=$(bash scripts/detect-project.sh project)
          fi
          echo "PROJECT_TYPE=$PROJECT_TYPE" >> "$GITHUB_ENV"
          echo "Detected project type: $PROJECT_TYPE"

      - name: Set up Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Flutter doctor
        if: env.PROJECT_TYPE == 'flutter'
        run: flutter doctor -v

      - name: Set up Node.js for JavaScript-based projects
        if: env.PROJECT_TYPE == 'react_native' || env.PROJECT_TYPE == 'expo' || env.PROJECT_TYPE == 'capacitor' || env.PROJECT_TYPE == 'cordova' || env.PROJECT_TYPE == 'ionic'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" || true
          if grep -r "ndkVersion" project/ 2>/dev/null | head -1; then
            NDK_VER=$(grep -roh "ndkVersion\s*[=]*\s*['\"].*['\"]" project/ 2>/dev/null | head -1 | grep -oP "[\d.]+")
            if [ -n "$NDK_VER" ]; then
              echo "Installing NDK version: $NDK_VER"
              sdkmanager "ndk;$NDK_VER" || true
            fi
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ inputs.job_id }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Flutter pub packages
        if: env.PROJECT_TYPE == 'flutter'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ inputs.job_id }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Cache npm packages
        if: env.PROJECT_TYPE == 'react_native' || env.PROJECT_TYPE == 'expo' || env.PROJECT_TYPE == 'capacitor' || env.PROJECT_TYPE == 'cordova' || env.PROJECT_TYPE == 'ionic'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ inputs.job_id }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Patch gradle.properties for CI compatibility
        run: |
          GRADLE_PROPS=""
          if [ -f project/android/gradle.properties ]; then
            GRADLE_PROPS="project/android/gradle.properties"
          elif [ -f project/gradle.properties ]; then
            GRADLE_PROPS="project/gradle.properties"
          fi

          if [ -n "$GRADLE_PROPS" ]; then
            echo "" >> "$GRADLE_PROPS"
            echo "# CI patches" >> "$GRADLE_PROPS"
            echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> "$GRADLE_PROPS"
            echo "android.useAndroidX=true" >> "$GRADLE_PROPS"
            echo "android.enableJetifier=true" >> "$GRADLE_PROPS"
          fi

      - name: Patch package name
        if: ${{ inputs.package_name != '' }}
        run: bash scripts/patch-package-name.sh project "${{ inputs.package_name }}"

      - name: Patch app name
        run: bash scripts/patch-app-name.sh project "${{ inputs.app_name }}" || true

      - name: Set up signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "Keystore decoded successfully"
          else
            echo "No KEYSTORE_BASE64 secret configured, skipping signing setup"
          fi

      - name: Auto-fix Gradle issues
        run: |
          if [ -f project/android/gradlew ]; then
            chmod +x project/android/gradlew
          fi
          if [ -f project/gradlew ]; then
            chmod +x project/gradlew
          fi
          if [ -f project/android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|http://services.gradle.org|https://services.gradle.org|g' project/android/gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f project/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|http://services.gradle.org|https://services.gradle.org|g' project/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build project
        run: |
          case "$PROJECT_TYPE" in
            flutter)
              bash scripts/build-flutter.sh project "${{ inputs.build_mode }}"
              ;;
            react_native)
              bash scripts/build-react-native.sh project "${{ inputs.build_mode }}"
              ;;
            expo)
              bash scripts/build-expo.sh project "${{ inputs.build_mode }}"
              ;;
            native_android)
              bash scripts/build-native-android.sh project "${{ inputs.build_mode }}"
              ;;
            capacitor)
              bash scripts/build-capacitor.sh project "${{ inputs.build_mode }}"
              ;;
            cordova)
              bash scripts/build-cordova.sh project "${{ inputs.build_mode }}"
              ;;
            ionic)
              bash scripts/build-ionic.sh project "${{ inputs.build_mode }}"
              ;;
            *)
              echo "Unsupported project type: $PROJECT_TYPE"
              exit 1
              ;;
          esac

      - name: Sign APK
        run: |
          if [ -f release.keystore ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            APK_FILE=$(find project -name "*.apk" -not -name "*unsigned*" -type f | head -n 1)
            if [ -n "$APK_FILE" ]; then
              bash scripts/sign-apk.sh \
                "$APK_FILE" \
                release.keystore \
                "${{ secrets.KEYSTORE_PASSWORD }}" \
                "${{ secrets.KEY_ALIAS }}" \
                "${{ secrets.KEY_PASSWORD }}" || echo "Signing failed, continuing with unsigned APK..."
            else
              echo "No APK found to sign"
            fi
          else
            echo "No keystore configured, skipping signing"
          fi

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          find project -name "*.apk" -type f
          APK_FILE=$(find project -name "*.apk" -not -name "*unsigned*" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find project -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found after build"
            exit 1
          fi
          SAFE_NAME=$(echo "${{ inputs.app_name }}" | sed 's/[^a-zA-Z0-9._-]/_/g')
          cp "$APK_FILE" "output/${SAFE_NAME}_${{ inputs.build_mode }}.apk"
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job_id }}
          path: output/*.apk
          retention-days: 1

      - name: Build summary
        run: |
          echo "========================================="
          echo "Build Summary"
          echo "========================================="
          echo "Job ID:       ${{ inputs.job_id }}"
          echo "App name:     ${{ inputs.app_name }}"
          echo "Package:      ${PACKAGE_NAME:-<project default>}"
          echo "Project type: ${{ env.PROJECT_TYPE }}"
          echo "Build mode:   ${{ inputs.build_mode }}"
          echo "Status:       SUCCESS"
          echo "========================================="
          ls -lh output/
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
